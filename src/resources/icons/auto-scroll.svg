<?xml version="1.0" encoding="UTF-8"?>
<!-- Auto-scroll: a downward chevron with motion lines, evoking continuous
     scroll-to-bottom (TikTok-style auto-scroll affordance). Stroke uses
     currentColor so it picks up the button text color from QSS. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="#ffffff" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- top motion line (faint) -->
  <line x1="7" y1="4"  x2="17" y2="4"  opacity="0.35"/>
  <!-- middle motion line -->
  <line x1="6" y1="8"  x2="18" y2="8"  opacity="0.7"/>
  <!-- main downward chevron / play-down -->
  <polyline points="5,12 12,19 19,12"/>
  <!-- short tail under the chevron -->
  <line x1="12" y1="19" x2="12" y2="21" opacity="0.6"/>
</svg>
